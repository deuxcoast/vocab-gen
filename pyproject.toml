[project]
name = "vocab-gen"
version = "0.1.0"
description = "Generate Anki vocabulary sentences that reuse the words you're already learning."
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.40",
    "en-core-web-sm",
    "openai>=3.8.0",
    "spacy>=3.8.16",
    "wordfreq>=3.1.1",
]

[project.scripts]
vocab = "vocab_gen.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vocab_gen"]

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[dependency-groups]
dev = ["pytest>=8"]
